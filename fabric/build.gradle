plugins {
    id "com.gradleup.shadow" version "9.6.1"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${rootProject.fabric_kotlin_version}"

    modImplementation "${rootProject.imm_ptl_dep}"
    include "${rootProject.imm_ptl_dep}"

    // dev runs only: loom does not unpack nested jars, these already ship inside immersive portals
    modLocalRuntime fileTree(dir: "${rootProject.projectDir}/libs/devruntime", include: "*.jar")

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle project(path: ":common", configuration: "transformProductionFabric")
}

processResources {
    inputs.properties rootProject.ext.modMetadata
    filesMatching("fabric.mod.json") {
        expand rootProject.ext.modMetadata
    }
    from(rootProject.file("LICENSE")) { rename { "LICENSE_${rootProject.mod_id}" } }
}

shadowJar {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    configurations.set([project.configurations.shadowBundle])
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
