architectury {
    common((rootProject.enabled_platforms as String).split(","))
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"

    modCompileOnly "${rootProject.imm_ptl_dep}"
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    compileOnly fileTree(dir: "${rootProject.projectDir}/libs/devruntime", include: "voicechat-fabric-*.jar")

    testImplementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlin_version}"
}

def checks = [
        mazeCheck    : "worldgen.MazeLayoutCheckKt",
        trailerCheck : "command.TrailerSetCheckKt",
        lampCheck    : "client.LampFlickerCheckKt",
        burstCheck   : "level.LampBurstsCheckKt",
        lightCheck   : "client.IrradianceCheckKt",
        smilerCheck  : "smiler.SmilerCheckKt",
        gazeCheck    : "gaze.GazeCheckKt",
        directorCheck: "reality.DirectorCheckKt",
        replayCheck  : "network.ReplayPositionCheckKt",
        presenceCheck: "client.PresenceCheckKt",
        spawnCheck   : "level.SpawnPlanCheckKt",
        runCheck     : "level.RunStateCheckKt",
]

checks.each { name, main ->
    tasks.register(name, JavaExec) {
        group = "verification"
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "xyz.thewhish.substratum.${main}"
        workingDir = layout.buildDirectory.dir("checks")
        doFirst { workingDir.mkdirs() }
    }
}

tasks.register("shaderCheck", JavaExec) {
    group = "verification"
    description = "Compiles the Level 0 shaders with the local OpenGL driver."
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "xyz.thewhish.substratum.client.ShaderCheckKt"
    dependsOn processResources
    args file("${processResources.destinationDir}/assets/minecraft/shaders/program").absolutePath,
        fileTree(rootProject.file("libs/devruntime")) { include "sodium-*.jar" }.singleFile.absolutePath
}

[suitCheck: false, suitExport: true].each { name, write ->
    tasks.register(name, JavaExec) {
        group = write ? "build" : "verification"
        description = write ? "Writes the baked suit model for the launcher preview." : "Fails when the launcher suit model drifts from Suit.layer()."
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "xyz.thewhish.substratum.client.SuitExportKt"
        args rootProject.file("../launcher/assets/suit.json").absolutePath
        systemProperty "suit.write", write
    }
}

tasks.named("check") { dependsOn checks.keySet() + "suitCheck" }

tasks.named("test") { failOnNoDiscoveredTests = false }

processResources {
    def includes = file("src/main/shaders")
    inputs.dir(includes)
    filesMatching("assets/minecraft/shaders/program/substratum_*") {
        filter { String line ->
            def include = line.trim() =~ /^#moj_import <(.+)>$/
            include.matches() ? new File(includes, include.group(1)).text : line
        }
    }
    from(includes) {
        include "capsule.glsl"
        into "assets/substratum/shaders/include"
    }
}
