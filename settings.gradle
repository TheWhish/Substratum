pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "Substratum"

def platforms = new Properties()
file("gradle.properties").withInputStream { platforms.load(it) }

include("common")
platforms.getProperty("enabled_platforms").split(",").each { include(it.trim()) }
