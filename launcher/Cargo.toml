[package]
name = "substratum-launcher"
version = "0.1.0"
edition = "2024"
description = "Launcher for Substratum"
license = "MIT"
publish = false

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
md-5 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
slint = "1.18.1"
ureq = "3.5.1"
