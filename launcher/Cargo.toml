[package]
name = "substratum-launcher"
version = "0.2.0-alpha"
edition = "2024"
description = "Launcher for Substratum"
license-file = "../LICENSE"
publish = false

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
ed25519-dalek = { version = "3.0.0", features = ["alloc", "pkcs8"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
png = "0.18.1"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
slint = "1.18.1"
substratum-protocol = { version = "0.1.0", path = "../protocol" }
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.2.1"
ureq = "3.5.1"
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_Globalization"] }
