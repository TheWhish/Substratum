[package]
name = "substratum-launcher"
version = "0.1.0"
edition = "2024"
description = "Launcher for Substratum"
license = "MIT"
publish = false

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
png = "0.18.1"
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
toml = "1.2.1"
ureq = "3.5.1"
